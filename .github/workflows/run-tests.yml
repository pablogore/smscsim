name: run-tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run Golang tests
        # -race: the session store is reached from every connection goroutine and the web handler's
        run: go test -race -count=1
